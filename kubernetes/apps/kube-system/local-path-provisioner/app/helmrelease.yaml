# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: local-path-provisioner
spec:
  chartRef:
    kind: OCIRepository
    name: local-path-provisioner
  interval: 30m
  # Values: https://github.com/rancher/local-path-provisioner/blob/master/deploy/chart/local-path-provisioner/values.yaml
  values:
    fullnameOverride: local-path-provisioner
    configmap:
      name: local-path-config
    image:
      repository: docker.io/rancher/local-path-provisioner
      tag: v0.0.37@sha256:e757967a5ec338f6a9b371c5a9688bedaa8c3578ea3dd4db329ea0084be0a86f
    helperImage:
      repository: ghcr.io/home-operations/busybox
      tag: 1.38.0@sha256:ff88728f0d5fe50a9984f6cc04d7d1185590b628f29ef4e6a3ec8cae7169e0c8
    nodePathMap:
      # Dynamic claims use the NVMe-backed config filesystem.
      - node: DEFAULT_PATH_FOR_NON_LISTED_NODES
        paths:
          - /containers/config/kubernetes
    priorityClassName: system-node-critical
    # The provisioner does not need root privileges on the host.
    podSecurityContext:
      runAsNonRoot: true
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL
      readOnlyRootFilesystem: true
      runAsGroup: 65534
      runAsUser: 65534
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        memory: 64Mi
    storageClass:
      # Keep the k3s-compatible StorageClass for existing claims.
      # https://kubernetes.io/docs/concepts/storage/storage-classes/
      create: true
      defaultClass: true
      defaultVolumeType: local
      name: local-path
      provisionerName: rancher.io/local-path
      reclaimPolicy: Retain
      # Wait until a consuming pod selects the node for this local volume.
      volumeBindingMode: WaitForFirstConsumer
